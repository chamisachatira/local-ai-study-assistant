<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Llama Web Chatbot</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 0; 
            height: 100vh;
        }
        /* Floating corner chat container */
        .chat-container { 
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px; 
            height: 500px;
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            z-index: 1000;
        }
        .chat-header { 
            background: #007bff; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: bold; 
        }
        .chat-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: #fafafa;
        }
        .message { 
            padding: 10px 14px; 
            border-radius: 8px; 
            max-width: 80%; 
            line-height: 1.4; 
            word-wrap: break-word; 
            font-size: 14px;
        }
        .user-message { 
            background: #007bff; 
            color: white; 
            align-self: flex-end; 
        }
        .ai-message { 
            background: #e9ecef; 
            color: #333; 
            align-self: flex-start; 
        }
        .chat-input-area { 
            display: flex; 
            padding: 12px; 
            background: #fff; 
            border-top: 1px solid #ddd; 
        }
        .chat-input-area input { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            outline: none; 
            font-size: 14px; 
        }
        .chat-input-area button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            margin-left: 8px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .chat-input-area button:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Ask AI Assistant</div>
    <div id="chatBox" class="chat-box">
        <div class="message ai-message">Hello! I am your local AI assistant running offline. How can I help you?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const messageText = inputField.value.trim();

        if (!messageText) return;

        chatBox.innerHTML += `<div class="message user-message">${escapeHtml(messageText)}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai-message">Thinking...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: messageText })
            });
            const data = await response.json();

            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message ai-message">${escapeHtml(data.reply)}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message ai-message" style="color: red;">Error: Could not reach backend.</div>`;
        }
    }

    function handleKey(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
